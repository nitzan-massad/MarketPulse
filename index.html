<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) return real numbers. Without
     it iOS keeps the page inset from the screen, every inset resolves to 0, and Safari
     paints the page itself in the leftover strip below the viewport — which is what put
     table rows under the bottom nav. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Market Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- a returning user's session restore calls these two in series before RTDB may connect -->
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,500;1,800&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg">
<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%manifest.webmanifest">
<meta name="theme-color" content="#F4F6F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Market Pulse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
