name: Track requested stocks

# The lite run behind "Track this stock". The Cloudflare Worker (worker/) dispatches this the
# moment a user presses the button; it handles EVERY pending request, so a dispatch that gets
# collapsed into another is lost harmlessly. Nothing pending => it stops after ~15s.
#
# It never commits or deploys: the fetched row + forecast/bullbear/pe payloads go to RTDB
# `trackedRows/<KEY>`, which the app merges over its bundle at load, so the stock is live within
# minutes. The next site.yml run folds trackedRows into the repo (before its pin) and clears them
# after its deploy. See ci/track-requests.mjs. The 5h site.yml run also pins and marks the same
# requests, so it is the fallback if this fails.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Its own group, NOT site.yml's `pages`: nothing here touches main or Pages, so it no longer waits
# behind a 15-48 min site run. A dispatch during a lite run queues (a newer one replaces a queued
# one, harmlessly: every run handles every pending request).
concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # a hung FlareSolverr would otherwise hold the runner for GitHub's 6h default
    timeout-minutes: 10
    env:
      FLARESOLVERR_URL: http://localhost:8191/v1
      # Node gives IPv4 only 250ms before falling back to IPv6, which the runner lacks — with the
      # FlareSolverr pull running alongside, the RTDB connect missed that window (run 39747701923)
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
    steps:
      # Not a `services:` container: those start before the first step, so every run (even an
      # empty one) waited ~13-25s for the pull. Backgrounded, the pull overlaps checkout, setup-node
      # and pin; `fetch` waits for it only when there is a ticker (waitForFlare).
      - name: Start FlareSolverr (background)
        run: (docker run -d --name flaresolverr -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest > /dev/null 2>&1 &)

      - uses: actions/checkout@v4

      # Node 24 — see site.yml. ci/track-requests.mjs needs no npm deps, so pin+fetch run
      # before `npm ci`, and an empty dispatch stops here. No `cache: npm`: node_modules is
      # cached below, so the ~/.npm cache would be a second download of the same thing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin + fetch requested tickers
        id: fetch
        env:
          LITE: "1"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node ci/track-requests.mjs pin
          node ci/track-requests.mjs fetch

      # node_modules cached on the lockfile: a hit skips the ~19s `npm ci`.
      - id: nm
        if: steps.fetch.outputs.tickers != ''
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      # In parallel: each writes only its own public/<dir>, all read stocks.json. P/E uses the
      # same keys as site.yml; the 5Y closes come from CNBC (Twelve Data only as a fallback).
      # The scrapers need no node_modules, so a cache-miss `npm ci` runs alongside them; only the
      # gate needs it. A failed npm ci can't slip past continue-on-error: the gate can't run without it.
      - name: Forecasts + Bulls/Bears + P/E for just these
        if: steps.fetch.outputs.tickers != ''
        continue-on-error: true
        env:
          ONLY: ${{ steps.fetch.outputs.tickers }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TWELVEDATA_CI_KEY: ${{ secrets.TWELVEDATA_CI_KEY }}
        run: |
          if [ "${{ steps.nm.outputs.cache-hit }}" != "true" ]; then npm ci & n=$!; fi
          node ci/scrape-forecasts.mjs & a=$!
          node ci/scrape-bullbear.mjs & b=$!
          node ci/scrape-pe.mjs & c=$!
          # `|| r=$?`, not `; r=$?`: Actions runs bash -e, which would quit at the first failed wait
          # and leave the others still writing while the gate runs
          ra=0; rb=0; rc=0
          wait $a || ra=$?; wait $b || rb=$?; wait $c || rc=$?
          if [ -n "${n:-}" ]; then wait $n || echo "npm ci failed"; fi
          echo "exit: forecasts=$ra bullbear=$rb pe=$rc"
          [ $((ra+rb+rc)) -eq 0 ]

      # THE DATA GATE for what this run uploads: the scrapers above are continue-on-error, so
      # this vets the files they left on disk. Deliberately NOT continue-on-error — red here
      # means nothing is uploaded and nothing is marked.
      # Only the checks that read what this run writes: stocks.json (ai-scale), the payload files +
      # tracked.json (payload-files), public/pe (pe-files), and fmtPx — it imports lib.ts, so the
      # --strict tsc pass type-checks seen.json. Everything else is a code/posts test this run can't
      # affect; site.yml still runs the full suite.
      - name: Data gate
        if: steps.fetch.outputs.tickers != ''
        env:
          SKIP_CHECKS: '^(?!ci/test-(ai-scale|payload-files|pe-files)\.mjs$|src/fmtPx\.check\.ts$)'
        run: npm test

      - name: Upload to RTDB trackedRows
        if: steps.fetch.outputs.tickers != ''
        env:
          TICKERS: ${{ steps.fetch.outputs.tickers }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ci/track-requests.mjs upload

      # After the upload: tracked=true is what fires the user's "now tracked" notification,
      # so it must mean the data is live (the app reads trackedRows at load).
      - name: Mark requests tracked
        if: steps.fetch.outputs.tickers != ''
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ci/track-requests.mjs mark
