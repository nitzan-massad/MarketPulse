name: Refresh data & deploy

on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours
  workflow_dispatch:         # manual run button
  push:
    branches: [main]         # redeploy on code changes

permissions:
  contents: write   # commit refreshed data
  pages: write      # deploy Pages
  id-token: write   # Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - uses: actions/checkout@v4

      # Node 24 (LTS), not 20: ci/test-consensus-direction.mjs imports ../src/consensus.ts,
      # and importing .ts needs native type stripping, which landed unflagged in 22.18.
      # On Node 20 that check cannot execute at all (ERR_UNKNOWN_FILE_EXTENSION).
      # Keep this in step with .github/workflows/tests.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # LOGIC GATE — checks the code before it is allowed to scrape. This does NOT vet the
      # data this run produces: the data checks (ci/test-ai-scale.mjs,
      # ci/test-consensus-direction.mjs) read src/data/*.json off disk, which at this point
      # is still the PREVIOUS commit's snapshot. The post-refresh run below is what vets
      # what we actually ship. Deliberately NOT `continue-on-error`, unlike the refresh
      # steps: a red check must stop this job.
      - name: Run all checks (npm test)
        run: npm test

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pull a fresh TipRanks snapshot via FlareSolverr (solves Cloudflare from
      # the runner's datacenter IP). Skipped on plain code pushes. A blocked
      # fetch fails this step but NOT the run — the site still deploys last data.
      - name: Refresh TipRanks snapshot (via FlareSolverr)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: node ci/refresh-data-ci.mjs

      # Backfill analyst forecasts for tickers missing a file (new arrivals).
      # Additive + failure-tolerant; never blocks the deploy.
      - name: Backfill analyst forecasts (via FlareSolverr)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: node ci/scrape-forecasts.mjs

      # Backfill Bulls Say / Bears Say (AI thesis) from TipRanks' stock-analysis
      # payload. Same additive + failure-tolerant pattern; never blocks the deploy.
      - name: Backfill bulls/bears (via FlareSolverr)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: node ci/scrape-bullbear.mjs

      # Rebuild the compact "recent reviews" feed New Arrivals reads (from the forecasts on disk).
      - name: Build recent-reviews feed
        if: github.event_name != 'push'
        continue-on-error: true
        run: node ci/build-reviews-recent.mjs

      # Sector average P/E (trailing + forward) from Finviz — one GET, no key.
      # Via FlareSolverr because Finviz is Cloudflare-fronted and the runner IP may be challenged.
      - name: Refresh sector P/E averages
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: node ci/scrape-sectors.mjs

      # THE DATA GATE — the one that actually protects what ships. Everything above this
      # point is `continue-on-error`, and the pre-scrape `npm test` could only vet the
      # PREVIOUS snapshot, so without this step a mapping regression (the ÷10 AI-scale bug,
      # a blanked column, a reshaped payload) would be committed to `main` AND deployed,
      # and would first go red on the next cron run 5h later — by which time the bad data
      # is already live. The refresh commit also carries `[skip ci]`, so tests.yml never
      # sees it either.
      #
      # Deliberately NOT `continue-on-error`: failing here aborts before the commit and
      # before the Pages deploy, so nothing is written and the last good deploy stays up.
      # Re-runs the whole suite rather than a data-only subset — it takes ~2s, and a
      # separate "which checks are the data ones" list is one more thing to get wrong.
      - name: Re-check the refreshed data (THE DATA GATE)
        if: github.event_name != 'push'
        run: npm test

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data public/forecasts public/bullbear public/reviews-recent.json; then
            echo "No data change."
          else
            git add src/data public/forecasts public/bullbear public/reviews-recent.json
            git commit -m "chore: refresh TipRanks snapshot [skip ci]"
            git push
          fi

      - name: Build
        env:
          VITE_FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          VITE_TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          VITE_FMP_KEY: ${{ secrets.FMP_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
