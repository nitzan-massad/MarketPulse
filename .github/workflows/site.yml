name: Refresh data & deploy

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours, off the top of the hour (GitHub delays/drops :00 runs)
  workflow_dispatch:         # manual run button
    inputs:
      dry_run:
        description: "Scrape and run the gates, but do not commit, deploy or mark requests tracked"
        type: boolean
        default: false
  push:
    branches: [main]         # redeploy on code changes

permissions:
  contents: write   # commit refreshed data
  pages: write      # deploy the github.io redirect stub
  id-token: write   # Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # a blocked run used to retry to GitHub's 6h job limit; the longest healthy run is ~2h
    timeout-minutes: 220
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      # fetch-depth: 0 — NOT the default 1. ci/generate-posts.mjs builds its 30-snapshot
      # window with `git log -30 -- src/data/stocks.json`, and on a shallow clone that
      # returns exactly ONE sha, silently (git exits 0). The window collapses to 2, which
      # is below MIN_WINDOW (ci/hooks.mjs), so the record/trend/steady/churn/newcomer rules
      # never fire in the only environment that runs them. A bounded depth would have to
      # comfortably contain 30 *data* commits, and code commits interleave with them, so
      # there is no safe number — full history is the correct setting. Do not "optimise"
      # this back to a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 (LTS), not 20: ci/test-consensus-direction.mjs imports ../src/consensus.ts,
      # and importing .ts needs native type stripping, which landed unflagged in 22.18.
      # On Node 20 that check cannot execute at all (ERR_UNKNOWN_FILE_EXTENSION).
      # Keep this in step with .github/workflows/tests.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # LOGIC GATE — checks the code before it is allowed to scrape. This does NOT vet the
      # data this run produces: the data checks (ci/test-ai-scale.mjs,
      # ci/test-consensus-direction.mjs) read src/data/*.json off disk, which at this point
      # is still the PREVIOUS commit's snapshot. The post-refresh run below is what vets
      # what we actually ship. Deliberately NOT `continue-on-error`, unlike the refresh
      # steps: a red check must stop this job.
      - name: Run all checks (npm test)
        run: npm test

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Lite-run tickers (track-requests.yml) live in RTDB trackedRows until this folds them into
      # stocks/tracked/seen.json + public/forecasts|bullbear|pe. MUST come before the pin and the
      # refresh: their requests are already tracked=true, so pin won't re-add them, and with no
      # row planUnrequest would delete the request. A failed fold leaves them in trackedRows (still
      # live in the app; pin counts them as rows) for the next run.
      - name: Fold lite-run tracked rows
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ci/track-requests.mjs fold

      # What the data-loss gate (ci/test-no-data-loss.mjs, inside THE DATA GATE below) compares the
      # refreshed data against. After the fold, before pin/refresh/backfills rewrite anything.
      - name: Snapshot previous data (for the data-loss gate)
        if: github.event_name != 'push'
        run: |
          cp src/data/stocks.json "$RUNNER_TEMP/prev-stocks.json"
          cp src/data/seen.json "$RUNNER_TEMP/prev-seen.json"
          cp -r public/forecasts "$RUNNER_TEMP/prev-forecasts"

      # User "Track this stock" requests (RTDB trackRequests) join src/data/tracked.json, and
      # watchlists + views go to keepalive.json, so the refresh below keeps/backfills them via the
      # keep set. See ci/track-requests.mjs.
      # dry_run must stay read-only: pin PATCHes RTDB (planUnrequest deletes requests whose stock was
      # dropped), so a dry run skips it. Nothing downstream needs it: the refresh reads tracked.json as
      # committed. (Fold above only GETs RTDB; its local file writes are never committed on a dry run.)
      - name: Pin requested tickers
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ci/track-requests.mjs pin

      # Pull a fresh TipRanks snapshot via FlareSolverr (solves Cloudflare from
      # the runner's datacenter IP). Skipped on plain code pushes. A blocked
      # fetch fails this step but NOT the run — the site still deploys last data.
      - name: Refresh TipRanks snapshot (via FlareSolverr)
        id: snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 15
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
          DROPPED: ${{ runner.temp }}/dropped.json # expired tickers, read by the data-loss gate
        run: node ci/refresh-data-ci.mjs

      # Three backfills, run side by side (the track-requests.yml pattern) instead of one after
      # another: bulls/bears and P/E finish inside forecasts' ~55-100 min, so they cost no wall time.
      # Safe because each writes only its own files and all three only READ src/data/stocks.json
      # (written by the snapshot step above), pinned.json and public/earnings.json (written below):
      #   forecasts -> public/forecasts/<T>.json + _asOf.json
      #   bullbear  -> public/bullbear/<T>.json (asOf inside each file)
      #   pe        -> public/pe/<T>.json + _asOf.json, ci/cache/pe/<T>.json
      # Every step below waits for all three (the reviews feed reads public/forecasts).
      # FlareSolverr: one Chrome per request, waitress serves 4 at once — forecasts' 3 workers +
      # bulls/bears' 1 fit without queueing. P/E never touches it (CNBC, Finnhub, SEC, Twelve Data).
      # Measured on 4 CPUs, 12 tickers each: forecasts 118s alone vs 125s beside bulls/bears.
      #
      # Additive + failure-tolerant; never blocks the deploy. A failed scraper fails this step
      # (the exit line says which), never the others: each is waited on separately.
      # Per-scraper env stays per command, not step env — LIMIT and STALE_DAYS differ:
      #   forecasts: no age gate — the 300 stalest every run, so all ~518 rotate within 2 runs
      #     (≤10h) and fresh reviews land the same day. PARALLEL=2: bullbear's Chrome runs beside
      #     it, so 3 here made 4 Chromes on the 4-vCPU runner -> 175 FlareSolverr 60s timeouts
      #     (run 42022887893; ~28 median at 3 alone). Alone, 3 beat 2 (8.9 vs 12.5 s/ticker).
      #   bullbear: Bulls Say / Bears Say (AI thesis) from the SSR tipranks.com/stocks/<t> page.
      #     LIMIT 200 (was 90 and always hit; ~4-7 min).
      #   pe: 5-year weekly P/E history per ticker for the stock modal's P/E chart. Inputs cached
      #     per ticker in ci/cache/pe/ (committed): split-only weekly closes from CNBC, refreshed
      #     weekly (Twelve Data only as the fallback for a ticker with none), then this week's close
      #     from our own stocks.json; Finnhub quarterly EPS/peTTM and SEC EDGAR report dates on a
      #     rotating LIMIT. Every ticker's chart is recomputed from cache each run. LIMIT 200 (was
      #     60, ~8 runs to rotate); Finnhub-paced at 60/min; CNBC closes capped at 60/run.
      # Forecasts streams live; the other two buffer to files and print in groups afterwards, so
      # the log isn't interleaved and bullbear's `::warning::` tripwire still starts a line.
      - name: Backfill forecasts + bulls/bears + P/E (in parallel)
        id: backfill
        if: github.event_name != 'push'
        continue-on-error: true
        # forecasts' worst recent run was ~102 min; a hung scraper now ends only this step
        # (continue-on-error), not the whole deploy at GitHub's 6h job limit
        timeout-minutes: 150
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }} # fallback only (CNBC first)
          TWELVEDATA_CI_KEY: ${{ secrets.TWELVEDATA_CI_KEY }} # optional; used first when set
        run: |
          # print the buffered logs on EVERY exit, including a timeout/cancel kill, so a hang point
          # and bullbear's ::warning:: are never lost
          dump() { for n in bullbear pe; do echo "::group::$n"; cat "$RUNNER_TEMP/$n.log" 2>/dev/null; echo "::endgroup::"; done; }
          trap 'dump; trap - EXIT' EXIT INT TERM
          STALE_DAYS=0 LIMIT=300 PARALLEL=2 node ci/scrape-forecasts.mjs & a=$!
          LIMIT=200 node ci/scrape-bullbear.mjs > "$RUNNER_TEMP/bullbear.log" 2>&1 & b=$!
          LIMIT=200 node ci/scrape-pe.mjs > "$RUNNER_TEMP/pe.log" 2>&1 & c=$!
          # `|| r=$?`, not `; r=$?`: Actions runs bash -e, which would quit at the first failed wait
          # and leave the others still writing while the steps below run
          ra=0; rb=0; rc=0
          wait $a || ra=$?; wait $b || rb=$?; wait $c || rc=$?
          echo "exit: forecasts=$ra bullbear=$rb pe=$rc"
          [ $((ra+rb+rc)) -eq 0 ]

      # Rebuild the compact "recent reviews" feed New Arrivals reads (from the forecasts on disk).
      - name: Build recent-reviews feed
        if: github.event_name != 'push'
        continue-on-error: true
        run: node ci/build-reviews-recent.mjs

      # Sector average P/E (trailing + forward) from Finviz — one GET, no key.
      # Via FlareSolverr because Finviz is Cloudflare-fronted and the runner IP may be challenged.
      - name: Refresh sector P/E averages
        id: sectors
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: node ci/scrape-sectors.mjs

      # CNN's Fear & Greed index — one plain GET, no key and no FlareSolverr (CNN is
      # Fastly-fronted, not Cloudflare; a browser UA + a cnn.com Referer clears its bot
      # gate). Browsers cannot send either header, which is why this runs here and the
      # app reads the committed file. continue-on-error like every other scrape: a 418
      # leaves yesterday's reading in place rather than failing the deploy.
      - name: Refresh Fear & Greed index
        id: feargreed
        if: github.event_name != 'push'
        continue-on-error: true
        run: node ci/scrape-feargreed.mjs

      # Next earnings date for every listed company (Finnhub's calendar, ~70 calls a run) —
      # the stock modal's "Earnings Thu · after close" line. Same failure-tolerant pattern:
      # a bad run keeps the previous file, whose dates are still mostly right.
      - name: Refresh earnings calendar
        id: earnings
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node ci/scrape-earnings.mjs

      # Generate one social post from the snapshot just refreshed. Scrape-class step:
      # `continue-on-error` like every other one above the data gate, so a rate-limited model or
      # a field of unpublishable candidates never stops the data from shipping (the health gate
      # at the end still turns the run red when this step fails).
      # Runs BEFORE the gate so the post ships in the same commit as the data it describes.
      # Cadence is entirely in the env below — POSTS_PER_RUN is the knob.
      - name: Generate social post
        id: post
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          POSTS_ENABLED: "true"
          POST_PROVIDER: cloudflare
          POSTS_PER_RUN: "1"
          POST_CANDIDATES: "5"
          # 240 snapshots at the 3h cadence is ~30 days (was 144 at 5h; 144 measured 1.9s, 87MB).
          # This is why the checkout is not shallow — see fetch-depth above.
          POST_WINDOW: "240"
          POST_IMAGES: "true"
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node ci/generate-posts.mjs

      # Sector-filter themes (Quantum Computing): each company asked once, by the same free
      # Cloudflare model, after the post so the post keeps first claim on the daily neurons.
      # New arrivals cost 0-5 calls a run; a backfill is capped at 150 calls a run.
      - name: Classify sector themes
        id: themes
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node ci/classify-themes.mjs

      # THE DATA GATE — the one that actually protects what ships. Everything above this
      # point is `continue-on-error`, and the pre-scrape `npm test` could only vet the
      # PREVIOUS snapshot, so without this step a mapping regression (the ÷10 AI-scale bug,
      # a blanked column, a reshaped payload) would be committed to `main` AND deployed,
      # and would first go red on the next cron run 5h later — by which time the bad data
      # is already live. The refresh commit also carries `[skip ci]`, so tests.yml never
      # sees it either.
      #
      # Deliberately NOT `continue-on-error`: failing here aborts before the commit and
      # before the Pages deploy, so nothing is written and the last good deploy stays up.
      # Re-runs the whole suite rather than a data-only subset — it takes ~2s, and a
      # separate "which checks are the data ones" list is one more thing to get wrong.
      - name: Re-check the refreshed data (THE DATA GATE)
        if: github.event_name != 'push'
        env:
          PREV_DIR: ${{ runner.temp }} # ci/test-no-data-loss.mjs: previous snapshot to compare against
          DROPPED: ${{ runner.temp }}/dropped.json
        run: npm test

      # dry_run (manual runs only; empty -> falsy on schedule/push) stops here: scrape + gates ran,
      # nothing is committed, deployed or marked.
      - name: Commit refreshed data
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data public/forecasts public/bullbear public/pe ci/cache public/reviews-recent.json public/post-images public/earnings.json; then
            echo "No data change."
          else
            git add src/data public/forecasts public/bullbear public/pe ci/cache public/reviews-recent.json public/post-images public/earnings.json
            git commit -m "chore: refresh TipRanks snapshot [skip ci]"
            # a code push landing during this ~2h run must not discard the data (run 42022887893)
            git pull --rebase
            git push
          fi

      - name: Build
        env:
          VITE_FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          VITE_TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          VITE_FMP_KEY: ${{ secrets.FMP_KEY }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: ${{ !inputs.dry_run }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools deploy --only hosting --project marketpulse-df5d9 --non-interactive

      # The old https://nitzan-massad.github.io/MarketPulse/ URL keeps serving only a redirect
      # to the Firebase site. 404.html catches every deep path.
      - run: cp redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: redirect

      - id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v4

      # After the deploy: tracked=true fires the requester's "now tracked" notification, so it
      # must mean the row is live. See ci/track-requests.mjs.
      - name: Mark requests tracked
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ci/track-requests.mjs mark

      # The folded rows are committed and deployed now, so their trackedRows entries go — each
      # only if its asOf is still the one folded (a lite run may have rewritten it meanwhile).
      # trackedRevs is kept. See ci/track-requests.mjs.
      - name: Clear folded tracked rows
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ci/track-requests.mjs clear

      # LAST step, after the commit/deploy, so data ships even when a source degraded — but the run
      # goes red so GitHub emails the owner. Trips on a line in $RUNNER_TEMP/health (breaker open,
      # universe failure, >30% carried, >10% forecasts failed) or any scrape step whose OUTCOME is
      # failure/cancelled (outcome, not conclusion: continue-on-error makes conclusion "success").
      # 'skipped' is fine: push events skip every scrape step, dry_run still reaches this gate.
      - name: Health gate
        if: always()
        env:
          OUTCOMES: >-
            snapshot=${{ steps.snapshot.outcome }}
            backfill=${{ steps.backfill.outcome }}
            sectors=${{ steps.sectors.outcome }}
            feargreed=${{ steps.feargreed.outcome }}
            earnings=${{ steps.earnings.outcome }}
            post=${{ steps.post.outcome }}
            themes=${{ steps.themes.outcome }}
        run: |
          bad=0
          if [ -s "$RUNNER_TEMP/health" ]; then
            echo "::error::degraded sources:"; cat "$RUNNER_TEMP/health"; bad=1
          fi
          for o in $OUTCOMES; do
            case "${o#*=}" in
              failure|cancelled) echo "::error::step ${o%%=*} ended ${o#*=}"; bad=1 ;;
            esac
          done
          exit $bad
