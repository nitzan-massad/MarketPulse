name = "marketpulse-track"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
ORIGIN = "https://marketpulse-app.web.app"

# Live-quote relay: one shared Finnhub socket (a key allows only one). FINNHUB_KEY is a secret.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRelay"]

# Keeps console.log/error from the "Track this stock" dispatch (dashboard: Workers → marketpulse-track → Logs).
[observability]
enabled = true
